name: .NET

on:
  push:
    branches: [ dev ]
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dotnet

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Central package management pins every version, so the lock is the props file.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('dotnet/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PathOfBuilding.sln

      # TreatWarningsAsErrors is set in Directory.Build.props, so any warning fails here.
      - name: Build
        run: dotnet build PathOfBuilding.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PathOfBuilding.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: dotnet/TestResults/**/*.trx
          if-no-files-found: warn

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Whitespace is at `suggestion` severity in dotnet/.editorconfig so a stray blank
      # line never breaks a compile under TreatWarningsAsErrors. This job is where it is
      # actually enforced. Style rules run at `warn` — the same bar the build applies.
      - name: Verify formatting
        run: dotnet format whitespace PathOfBuilding.sln --verify-no-changes

      - name: Verify code style
        run: dotnet format style PathOfBuilding.sln --verify-no-changes --severity warn
